<!doctype html><html><head><meta charset="utf-8"><title>SwiftRide routing check</title></head><body><h1>SwiftRide routing connection</h1><p>This check uses public Orange Walk landmarks. It does not request your GPS or change a ride.</p><button id="check">Check directions connection</button><pre id="result">Ready</pre><script>
document.getElementById('check').onclick=async()=>{const out=document.getElementById('result');out.textContent='Checking Google road directions…';try{if(!window.google?.maps?.importLibrary)await new Promise((resolve,reject)=>{window.mapsCheckReady=resolve;const s=document.createElement('script');s.src='https://maps.googleapis.com/maps/api/js?'+new URLSearchParams({key:"AIzaSyBpkP-1hNTsxKVNmPhPP_J-SawsNZi3TIQ",loading:'async',v:'weekly',callback:'mapsCheckReady'});s.onerror=()=>reject(Error('Map script failed'));document.head.append(s);});const {Route}=await google.maps.importLibrary('routes');const {routes}=await Route.computeRoutes({origin:{lat:18.081093,lng:-88.559710},destination:{lat:18.077433,lng:-88.563830},travelMode:'DRIVING',language:'en',fields:['path','legs.steps','distanceMeters','durationMillis']});out.textContent=JSON.stringify({routes:routes?.length,steps:routes?.[0]?.legs?.[0]?.steps?.length,metres:routes?.[0]?.distanceMeters},null,2);}catch(e){out.textContent=String(e.message).replace(/key=[^&\s]+/g,'key=[hidden]');}};
</script></body></html>
